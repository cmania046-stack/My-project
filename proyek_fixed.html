<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard pos</title>
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');

:root {
  --primary: #0E5FA8;
  --primary-hover: #0A4C87;
  --primary-soft: #DEEBF9;
  --accent: #FFB020;
  --accent-hover: #E89900;
  --accent-ink: #7A4A00;
  --success: #1E9E5A;
  --success-soft: #E1F7EA;
  --danger: #E4572E;
  --danger-soft: #FDE6DF;
  --danger-hover: #C7431E;
  --warning: #F5A623;
  --warning-soft: #FFF2D9;
  --bg: #F5F9FC;
  --surface: #FFFFFF;
  --surface-alt: #EEF5FB;
  --header-bg: #ffffff;
  --footer-bg: #ffffff;
  --text: #2E4248;
  --white-text: #0C1A22;
  --text-on-primary: #FFFFFF;
  --text-muted: #5C7488;
  --border: #D7E6F0;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 12px;
  --shadow-sm: 0 2px 8px rgba(14, 40, 60, .07);
  --shadow: 0 12px 28px rgba(14, 40, 60, .14);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: 'Sora', 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, "Courier New", monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  font-family: var(--font);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(255, 176, 32, .10) 0%, transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(14, 124, 102, .08) 0%, transparent 45%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.45;
}

button, input, select {
  font-family: inherit;
  font-size: 1rem;
}

input:hover, select:hover {
  border-color: var(--primary);
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(14, 124, 102, .16);
}

input:active, select:active {
  border-color: var(--primary-hover);
}

.hidden {
  display: none !important;
}

.chart-wrap {
  position: relative;
  height: 260px;
  width: 100%;
}
/* ===== Header & footer bar (mobile-first: header ringkas, footer jadi tab bar melayang) ===== */
.atas {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  padding: 14px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.atas-tengah {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.tt {
  cursor: pointer;
  color: var(--primary);
  background: var(--primary-soft);
  font-size: 1.2rem;
  line-height: 1;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  user-select: none;
  transition: background .15s ease, transform .1s ease;
}

.tt:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.tt:active {
  transform: scale(.94);
}

.greet {
  color: var(--text-muted);
  font-size: .9rem;
  font-weight: 500;
  opacity: 1;
  white-space: nowrap;
}

#jdl {
  margin-left: auto;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: .1px;
  white-space: nowrap;
}

.judul {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 2px;
}

.bawah {
  position: sticky;
  bottom: 0;
  z-index: 50;
  background: var(--footer-bg);
  border-top: 1px solid var(--border);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  width: 100%;
  margin: 0 auto;
  display: flex;
  overflow: auto;
  flex-wrap: nowrap;
  align-items: center;
  gap: 4px;
  box-shadow: 0 -8px 20px rgba(14, 60, 50, .08);
}

.bawah button {
  font-size: .85rem;
  padding: 10px 12px;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s ease, color .15s ease;
}

.bawah button:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.bawah button:active {
  background: var(--accent);
  color: var(--accent-ink);
}

/* ===== Popup menu (hamburger) ===== */
.popupMenu {
  position: absolute;
  top: 66px;
  left: 16px;
  z-index: 350;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 8px;
  min-width: 200px;
  animation: fromBottom .35s ease forwards;
}

.popupMenu .btn {
  width: 100%;
  justify-content: flex-start;
  background: transparent;
  color: var(--text);
  box-shadow: none;
  font-weight: 600;
}

.popupMenu .btn:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.popupMenu .btn:active {
  background: var(--accent);
  color: var(--accent-ink);
}

/* ===== Buttons ===== */
.btn {
  position: relative;
  appearance: none;
  border: none;
  cursor: pointer;
  background: var(--primary);
  color: var(--text-on-primary);
  font-weight: 600;
  font-size: .95rem;
  padding: 12px 20px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 5px;
  box-shadow: var(--shadow-sm);
  transition: background .15s ease, transform .1s ease;
}

.btn:hover {
  background: var(--primary-hover);
}

.btn:active {
  transform: translateY(1px) scale(.98);
  background: var(--primary-hover);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn-cancel {
  background: var(--primary-soft);
  color: var(--primary);
  padding: 12px;
  box-shadow: none;
  border: 1px double var(--border);
}

.btn-cancel:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
}

.btn-cancel:active {
  background: var(--primary);
  color: var(--text-on-primary);
}

.btn-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btns {
  background: var(--surface);
  padding: 10px;
  font-size: .85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 0 5px;
  cursor: pointer;
  color: var(--text);
  transition: background .15s ease, border-color .15s ease;
}

.btns2 {
  background: var(--surface);
  padding: 5px;
  border: none;
  margin: 0 5px;
  cursor: pointer;
  font-size: .85rem;
  color: var(--text-muted);
  transition: all 0.3s ease;
}
.btns2:active {
	color: #ffffff;
	background: #000000;
	border: none;
	border-radius: 2px;
}

.btns:hover {
  background: var(--surface-alt);
  border-color: var(--primary);
}

.btns:active {
  background: var(--primary-soft);
}

.btn-khusus-popup {
  font-size: 1rem;
  background: transparent;
  padding: 6px;
  margin: 5px 10px;
  border: none;
  color: var(--text-on-primary);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background .15s ease, color .15s ease;
}

.btn-khusus-popup:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.btn-khusus-popup:active {
  background: var(--surface-alt);
  color: var(--text);
}

.invisible-btn {
  background: transparent;
  font-size: 1rem;
  border: none;
  padding: 12px;
  cursor: pointer;
  width: 100%;
  color: var(--text);
  text-align: left;
  border-radius: var(--radius-sm);
  transition: background .15s ease;
}

.invisible-btn:hover {
  background: var(--primary-soft);
}

.invisible-btn:active {
  background: var(--accent);
}

/* Total / kembalian — signature "digital till readout" */
.total {
  color: var(--primary-hover);
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
  padding: 16px;
  background: transparent;
  border-radius: var(--radius);
  border: none;
  cursor: default;
  width: 100%;
  text-align: center;
  letter-spacing: .5px;
}

.tot, .change {
	color: var(--accent-ink);
	font-size: 1.85rem;
	font-weight: 700;
	font-family: var(--font-display);
	padding: 16px;
	background: var(--surface);
	border: none;
	border-radius: var(--radius-sm);
}

.badge {
  position: absolute;
  z-index: 200;
  top: -6px;
  right: -6px;
  padding: 4px 6px;
  min-width: 18px;
  border: 2px solid var(--surface);
  border-radius: 20px;
  background: var(--danger);
  color: white;
  font-size: .75rem;
  font-weight: 700;
  line-height: 1;
  text-align: center;
}

/* ===== Base page layout ===== */
.tengah {
	position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 10px;
  padding: 12px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  overflow: auto;
}

/* ===== Split layout (sidebar + main) — dipakai di Transaksi, Pemilik, Produk ===== */
.big-container {
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex: 1;
  gap: 14px;
  width: 100%;
}

.profil-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  display: flex;
  flex-direction: column;
  width: 100%;
  overflow: auto;
  max-width: 600px;
  gap: 10px;
  height: fit-content;
  animation: fromBottom .4s ease forwards;
}

.checkout-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  gap: 10px;
  height: 100%;
}

.right-container {
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field {
	position: relative;
	display: flex;
	background: var(--surface);
	flex-direction: column;
	gap: 10px;
	padding: 10px;
	padding-top: 20px;
	margin: 10px 0;
	border: 2px double var(--border);
	border-radius: var(--radius-sm);
	animation: fromBottom 0.5s ease forwards;
}

/* ===== Kartu generik (produk, user, pembayaran, dll) ===== */
.container {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius);
  border: none;
  display: flex;
  gap: 10px;
  padding: 10px;
  width: 100%;
  flex-direction: column;
  overflow: auto;
  transition: box-shadow .5s ease, border-color .25s ease, transform .3s ease;
}

.container:hover {
  box-shadow: var(--shadow);
}

.container-horizontal {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  gap: 10px;
  padding: 12px;
  width: 100%;
  flex-wrap: nowrap;
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s ease, border-color .15s ease;
}

.editor {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.produk-card {
  box-shadow: var(--shadow);
  max-width: 100%;
}

.produk-card.stok-kritis {
  background: var(--danger-soft);
  border-color: var(--danger);
}

.produk-card.stok-pas {
  background: var(--warning-soft);
  border-color: var(--warning);
}

/* Bungkus serbaguna dari pembuatFrame() — kartu besar maupun baris kecil (mis. stepper qty) */
.value-frame {
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  gap: 8px;
}

.value-frame {
  width: 100%;
  min-width: 0;
}

.image {
  width: 100%;
  height: 100%;
  border-radius: var(--radius);
  border: none;
  margin-bottom: 14px;
  align-self: center;
  object-fit: cover;
  animation: fromBottom .4s ease forwards;
}

.input-title {
	font-size: .8rem;
	font-weight: 550;
}

.gambar-profil {
  max-width: 180px;
  align-self: center;
  border: 3px solid var(--primary-soft);
  border-radius: 999px;
  animation: fromBottom .4s ease forwards;
}

.nama {
  position: relative;
  background-color: var(--primary-soft);
  font-size: 1rem;
  font-weight: 700;
  width: 100%;
  color: var(--primary);
  padding: 12px;
  align-self: center;
  margin: 0;
  border: none;
  border-radius: var(--radius-sm);
}

.nama-toko {
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--text);
  padding: 8px 20px;
  text-align: center;
  margin: 10px;
  font-weight: 700;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* checkbox (mis. "Termasuk pajak", "Cetak QR/Barcode") */
.label-data {
  position: relative;
  font-size: .95rem;
  font-weight: 500;
  color: var(--text);
  padding: 10px 42px 10px 14px;
  background: var(--surface-alt);
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary);
  border-right: none;
}

.cek {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  accent-color: var(--primary);
  width: 18px;
  height: 18px;
}

.biasa {
  background-color: transparent;
  font-size: .85rem;
  white-space: pre-line;
  color: var(--text-muted);
}

.font-biasa {
  background-color: transparent;
  font-size: 1rem;
  display: flex;
  color: var(--text-muted);
}

.teks {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text);
  padding: 5px;
  text-align: left;
}

.jdl {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  padding: 4px 0;
}

/* ===== Grid dan daftar (mobile-first: 1 kolom, melebar di layar besar) ===== */
.frame, .frame-khusus-produk {
  width: 100%;
  background: transparent;
  padding: 0;
  gap: 12px;
  overflow: visible;
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}

.frame-khusus-produk {
  display: flex;
  flex-direction: column;
}

.prt {
  background: transparent;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  padding: 15px;
  border-radius: var(--radius);
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  box-shadow: var(--shadow-sm);
}

/* dropdown metode pembayaran — panel biasa, bukan overlay */
.dropdown {
  display: none;
  background: var(--primary-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px;
  gap: 6px;
  height: fit-content;
  box-shadow: none;
  animation: fromBottom 0.5s ease forwards;
}

.menu-titik-tiga {
  position: absolute;
  top: 8px;
  right: 8px;
  display: none;
  background: var(--text);
  color: white;
  padding: 6px;
  border-radius: var(--radius-sm);
  z-index: 10;
  box-shadow: var(--shadow);
}

.menu-titik-tiga.tampil {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: stretch;
}

/* ===== Form fields ===== */
.entry, .combo {
  min-width: 50%;
  font-size: .85rem;
  padding: 10px;
  margin-bottom: 5px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s ease, box-shadow .15s ease;
}

.entry::placeholder {
  color: var(--text-muted);
}

/* ===== Table — mobile: scroll horizontal ===== */

.table-produk {
	width: 100%;
  margin-top: 10px;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: .9rem;
  animation: fromBottom 0.5s ease forwards;
}

.table-produk thead {
  background: var(--primary);
}

.table-produk thead th {
  text-align: center;
  color: var(--text-on-primary);
  font-weight: 600;
  padding: 12px 14px;
  font-size: .9rem;
  letter-spacing: .2px;
}

.table-produk tbody tr {
  cursor: pointer;
  border-top: 1px solid var(--border);
}

.table-produk tbody tr:nth-child(even) {
  background: var(--surface-alt);
}
.table-produk tbody tr:nth-child(odd) {
  background: var(--surface);
}

.table-produk tbody tr:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.table-produk td {
  padding: 10px 12px;
  color: var(--text);
  font-size: .9rem;
}

.table-produk .btn, .table-produk .btn-cancel {
  padding: 8px 10px;
  margin: 2px;
  min-height: unset;
}

/* ===== Login screen ===== */
.lc {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(14, 124, 102, .12);
}

.produk-pop {
	position: fixed;
	z-index: 200;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 20px;
	overflow: auto;
	background: var(--header-bg);
}

.lc-content {
  width: 100%;
  max-width: 360px;
  max-height: 80vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: auto;
  animation: fromBottom .4s ease forwards;
}

.lc-content h3 {
  font-family: var(--font-display);
  text-align: center;
  font-size: 1.2rem;
  margin-bottom: 4px;
  color: var(--primary);
}

.lc-content input {
  font-size: 1rem;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color .15s ease, box-shadow .15s ease;
}

/* ===== Modal ===== */
.custom-modal {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(12, 30, 34, .5);
  display: flex;
  align-items: center;
  backdrop-filter: blur(6px);
  justify-content: center;
  padding: 20px;
}

.custom-modal-content {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 22px 22px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: fromBottom .35s ease forwards;
  border-top: 5px solid var(--accent);
}

.custom-modal-content input {
  font-size: 1rem;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color .15s ease, box-shadow .15s ease;
}

#modalTitle {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
}

#modalMessage {
  font-size: .95rem;
  color: var(--text-muted);
  white-space: pre-line;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 6px;
}

/* ===== Loading overlay ===== */
.load-container {
  position: fixed;
  z-index: 500;
  width: 100%;
  height: 100%;
  background: rgba(246, 251, 249, .9);
  align-items: center;
  justify-content: center;
  display: flex;
  backdrop-filter: blur(6px);
  flex-direction: column;
}

.laptop {
  font-size: 3rem;
  padding: 5px;
  color: var(--primary);
  animation: happy 3s ease infinite;
}

.proses {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-soft);
  border-radius: var(--radius-sm);
  padding: 8px 24px;
}

@keyframes happy {
  0%, 100% { transform: translateY(0); }

/* ===== Struk (nota cetak) — tetap monospace agar rapi di printer thermal ===== */

@media (min-width: 600px) {
  .big-container {
    display: flex;
    flex-direction: row;
    gap: 20px;
    padding: 10px;
  }
  .atas-tengah {
  	display: flex;
  	flex-direction: row;

  }
  .tengah {
  	width: 100%;
  	display: flex;
  	flex-direction: column;
  	justify-content: flex-start;

  	width: fit-content;
  	min-width: 300px;

  }

    gap: 20px;
    display: grid;
    grid-template-columns: repeat(2,1fr);
  }
  .right-container {
  	flex: 1;
  }
  .frame-khusus-produk {
    display: grid;
    grid-template-columns: repeat(2,1fr);
  }
  .frame {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .container {
    height: fit-content;
    overflow: auto;
  }
  .image {
    width: 100%;
    height: 100%;
  }
  .checkout-container {
    height: 100vh;
    width: fit-content;
  }
  .lc-content {
    padding: 24px;
    max-width: fit-content;
    width: 100%;
  }
  .container-horizontal {
  	display: flex;
  	flex-direction: row;
  }
  .combo {
  	min-width: 0;
  }
}
@media print {
  body * {
    visibility: hidden;
  }
  #struk, #struk * {
    visibility: visible;
  }
  #struk {
    display: block !important;
    position: absolute;
    top: 0;
    left: 0;
    width: 80mm;
  }
}

@page {
  size: 80mm auto;
  margin: 0;

<script>
	async function generateBarcode(id, nama) {
		const data = {
			id: id,
			nama: nama
		}
		if (await modalShow(confirm, "Buat barcode baru untuk produk " + nama + "?")) {
			const upload = await postDataKedua("generate_barcode", data);
			showInfo(upload);
			produk.setup();
		}
	}
	function pembuatJendela() {
		makeWindow();
		const wadah = document.querySelector(".lc-content");
		wadah.innerHTML = "";
		return wadah;
	}
	function grafikMaker(parent, jdl, subjdl, lbls, lbl, data) {
		const wadah = document.createElement("div");
		wadah.className = "container";
		const judul = document.createElement("h3");
		judul.className = "teks";
		judul.textContent = jdl;
		const subjudul = document.createElement("p");
		subjudul.className = "biasa";
		subjudul.textContent = subjdl;
		const subparent = document.createElement("div");
		subparent.className = "chart-wrap";
		const canvas = document.createElement("canvas");
		subparent.appendChild(canvas);
		
		new Chart(canvas, {
			type: "bar",
			data: {
				labels: lbls,
				datasets: [{
					label: lbl,
					data: data,
					backgroundColor: "#0E5FA8",
					borderRadius: 2,
					maxBarThickness: 40
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					legend: { display: false }
				},
				scales: {
					y: {
						beginAtZero: true,
						grid: { color: "#f3f4f6" }
					},
					x: {
						grid: { display: false }
					}
				}
			}
		})
		for (const item of [judul, subjudul, subparent]) {
			wadah.appendChild(item);
		}
		parent.appendChild(wadah);
	}
</script>

  	document.querySelector(".lc").classList.add("hidden");

  function makeCekbox(parent, label) {
  	const lbl = makeLabel(label, "label-data");
  	const cek = document.createElement("input");
  	cek.type = "checkbox";
  	cek.className = "cek";
  	lbl.appendChild(cek);
  	parent.appendChild(lbl);
  	return cek;
  }
  
  function makeCekTrx(parent, label) {
  	const lbl = document.createElement("label");
  	const inp = document.createElement("input");
  	inp.type = "checkbox";
  	inp.style.width = "fit-content";
  	inp.style.margin = "0 5px";
  	lbl.textContent = label;
  	lbl.className = "biasa";
  	lbl.appendChild(inp);
  	
  	parent.appendChild(lbl);
  	return inp;
  }
  
  function makeParent(kelas) {
    const div = document.createElement("div");
    div.className = kelas;
    return div
  }
  
  function makeButton(kelas, teks, command) {
    const btn = document.createElement("button");
    btn.className = kelas;
    btn.textContent = teks;
    btn.onclick = function() {
      setTimeout(command, 300)
    }
    return btn;
  }
  
  function pembuatButton(parent, btn) {
  	for (const p of btn) {
  		const [kelas, teks, command] = p;
  		const button = makeButton(kelas, teks, command);
  		parent.appendChild(button);
  	}
  }
  
  function pembuatCombo(parent, def, data) {
		const select = document.createElement("select");
		select.className = "combo";
	
		const defaultTop = document.createElement("option");
		defaultTop.value = def;
		defaultTop.textContent = def;
		select.appendChild(defaultTop);
		
		for (const item of data) {
			const op = document.createElement("option");
			op.value = item;
			op.textContent = item;
			select.appendChild(op);
		}
	
		parent.appendChild(select);
		return select;
	}

  function pembuatEntry(parent, arrayObject) {
    let entries = {}
    for (const k of arrayObject) {
      const [key, value, tipe] = k;
      const lbl = makeLabel(key.replace(/_/g, " ").toUpperCase(), "input-title");
      const ent = document.createElement("input");
      ent.type = tipe;
      ent.placeholder = value;
      ent.className = "entry";
      entries[key] = ent
      parent.appendChild(lbl);
      parent.appendChild(ent);
    }
    return entries;
  }
  
  function pembuatFrame({
    displayFrame = "block",
    direction = "row",
    grid = "1fr",
    padding = "10px",
    margin = "10px",
    background = "white"
  } = {}) {
    let frame = document.createElement("div");
    frame.className = "value-frame";
    frame.style.display = displayFrame;
    frame.style.margin = margin;
    frame.style.padding = padding;
    frame.style.background = background;
  	frame.style.width = "100%";
  	frame.style.overflow = "auto";
    if (displayFrame === "flex") {
      frame.style.flexDirection = direction;
    } else if (displayFrame === "grid") {
      frame.style.gridTemplateColumns = grid;
    }
    
    return frame;
  }

  async function downloadNota(nama) {
    const cek = await postData("periksa_file", {nama: nama});
    if (!cek.ada) {
      await modalShow(gagal, "File nota tidak tersedia");
      return;
    }
    if (!nama) {
      await modalShow(gagal, "Maaf, nota yang Anda minta belum tersedia!");
      return
    }
    const konfirmasi = await modalShow(confirm, `Download nota ${nama} sekarang?`, false);
    if (!konfirmasi) {
      return;
    }
    try {
      const res = await fetch(url + "download_nota/" + nama);
      const blob = await res.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = nama;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    } catch (e) {
      await modalShow(error, e);
    }
  }

  function formatMataUang(uang) {
    if (formatUang[1] === "kiri") {
      return formatUang[0] + uang.toString().replace(/\B(?=(\d{3})+(?!\d))/g, formatUang[2]);
    } else {
      return uang.toString().replace(/\B(?=(\d{3})+(?!\d))/g, formatUang[2]) + formatUang[0];
    }
  }

  async function takePictures(file="", folder="", age=86400) {
  	try {
  		const info = {
  			file: file,
  			folder: folder,
  			age: age
  		}
  		const payload = JSON.stringify(info);
  		const link = `get_all_pictures/${encodeURIComponent(payload)}`;
  		const res = await fetch(url + link);
  		if (!res.ok) throw new Error(`Status ${res.status}`);
  		const blob = await res.blob();
  		return URL.createObjectURL(blob);
  	} catch (er) {
  		await modalShow(error, er);
  		return null;
  	}
  }

  function addPajak(harga, status = 0, persen = 0) {
  	let result = harga;
  	if (status === 1) {
  		result = Math.round(harga * (1 + persen / 100));
  	}
  	return result;
  }
  
  function hitungPotonganTingkat(harga, min, hargaTingkat, status = 0, persen = 0) {
  	let result = harga * min - hargaTingkat;
  	if (status === 1) {
  		result = result * (1 + persen / 100);
  	}
  	return result;
  }

  function makeTable(head) {
	  const table = document.createElement("table");
	  table.className = "table-produk";
	
	  const thead = document.createElement("thead");
	  thead.innerHTML = head;
	
	  const tbody = document.createElement("tbody");
	
	  table.appendChild(thead);
	  table.appendChild(tbody);
	
	  const originalAppend = table.appendChild.bind(table);
	
	  table.appendChild = function(child) {
	    if (child.tagName === "TR") {
	      return tbody.appendChild(child);
	    }
	    return originalAppend(child);
	  };
	
	  return table;
	}

  function modalShow(title, message, showInput = false) {
    return new Promise((resolve) => {
        const modal = document.getElementById("customModal");
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = message;

        const input = document.getElementById("modalInput");
        input.classList.toggle("hidden", !showInput);
        input.value = "";

        const btnOK = document.getElementById("modalBtnOK");
        const btnCancel = document.getElementById("modalBtnCancel");

        const newOK = btnOK.cloneNode(true);
        const newCancel = btnCancel.cloneNode(true);
        btnOK.replaceWith(newOK);
        btnCancel.replaceWith(newCancel);

        modal.classList.remove("hidden");

        newOK.onclick = function() {
            modal.classList.add("hidden");
            if (showInput) {
                resolve(input.value || "");
            } else {
                resolve(true);
            }
        };

        newCancel.onclick = function() {
            modal.classList.add("hidden");
            resolve(null);
        };

        input.onkeydown = function(e) {
            if (e.key === "Enter") {
                newOK.click();
            }
        };
    });
}

		async simpanProdukBaru() {
			const r1 = Object.fromEntries(
				Object.entries(this.info1).map(([key, val]) => [key, val.value.trim()])
			);
			const r2 = Object.fromEntries(
				Object.entries(this.info2).map(([key, val]) => [key, val.value.trim()])
			);
			const r3 = Object.fromEntries(
				Object.entries(this.info3).map(([key, val]) => [key, val.value.trim()])
			);
			const ktgr = this.newKategori.value;
			const sb = this.newSatuanBeli.value;
			const sj = this.newSatuanJual.value;
			const sup = this.newSupplier.value;
			
			const kategori = ktgr.toLowerCase() !== "pilih kategori baru" ? ktgr : r3.kategori;
			const satuanBeli = sb.toLowerCase() !== "pilih satuan beli baru" ? sb : r3.satuan_beli;
			const satuanJual = sj.toLowerCase() !== "pilih satuan jual baru" ? sj : r3.satuan_jual;
			const supplier = sup.toLowerCase() !== "pilih supplier baru" ? sup : r3.supplier;
			const waktu = this.exp.value.trim();
			
			if (![
				r1.nama,
				r1.jumlah,
				r1.harga_beli,
				r2.harga_jual,
				r2.isi_satuan
			].every(Boolean)) {
				await modalShow(gagal, "Nama, jumlah, harga beli, harga jual, dan isi satuan harus diisi");
				return;
			}
			
			try {
				const hargaBeli = parseFloat(r1.harga_beli);
				const jumlah = parseInt(r1.jumlah);
				const hargaJual = parseFloat(r2.harga_jual);
				const isiSatuan = parseInt(r2.isi_satuan);
				const poin = parseInt(r2.poin);
				const stokMinimum = parseInt(r2.stok_minimum);
				const hargaModal = Math.round(hargaBeli / isiSatuan);
				
				const data = {
					nama: r1.nama,
					barcode: r1.barcode,
					kategori: kategori,
					catatan: this.catatan.value.trim(),
					kadaluarsa: waktu,
					satuan_beli: satuanBeli,
					satuan_jual: satuanJual,
					isi_satuan: isiSatuan,
					supplier: supplier,
					harga_beli: hargaBeli,
					harga_modal: hargaModal,
					harga_jual: hargaJual,
					jumlah: jumlah,
					stok_minimum: stokMinimum,
					poin: poin,
					operator: user,
					sumber: idDevice
				}
				
				if (await modalShow(confirm, "Data telah siap. Unggah sekarang?")) {
					const upload = await postDataKedua("tambah_produk_baru", data);
					if (upload) {
						if (upload.stat.toLowerCase() === "berhasil") {
							const fotoKatalog = this.pilihGambar.files[0];
							if (fotoKatalog) {
								const formData = new FormData();
								formData.append("file", fotoKatalog, r1.nama + ".jpeg");
								const uploadGambar = await fetch(url + "post_file/upload_foto_katalog", {
									method: "POST",
									body: formData
								});
								const res = await uploadGambar.json();
								if (res.stat.toLowerCase() === "berhasil") {
									await modalShow(berhasil, res.pesan);
								} else {
									await modalShow(gagal, "Data berhasil disimpan. Foto katalog gagal disimpan")
								}
							} else {
								await modalShow(upload.stat, upload.pesan + "Katalog produk tidak disertakan");
							}
						} else {
							await modalShow(upload.stat, upload.pesan);
						}
					} else {
						await modalShow(gagal, pesanGagal);
					}
				}
			} catch (er) {
				await modalShow(error, er);
			}
		}
		
		hitungHargaModal() {
			const hargaBeli = parseFloat(this.info1.harga_beli.value.trim());
			const isi = parseInt(this.info2.isi_satuan.value.trim());
			const hargaModal = Math.round(hargaBeli / isi);
			this.infoLabel.textContent = "Harga modal produk: " + formatMataUang(hargaModal);
		}
		
		findProduk(teks="") {
			this.div.innerHTML = "";
			const tabel = makeTable(`
				<tr>
					<th><button class="btn btn-cancel" onclick="produk.showAndHide()">&#9635;</button>  Barcode</th>

					<th>Kategori</th>

					<th>Harga modal</th>
					<th>Harga jual</th>
					<th>Aksi</th>
				</tr>
			`)
			for (const item of this.produk) {
				if (
					item.nama.toLowerCase().includes(teks.toLowerCase()) ||

							<button class="btn btn-cancel" onclick="produk.editProduk(${item.id_produk})">📝</button>

				formData.append("file", fileGambar, nama + ".jpeg");
				if (await modalShow(confirm, "Gambar sudah siap. Simpan sekarang?")) {

						});

		async gantiFotoKatalog(field, id) {
			field.innerHTML = "";
			const legend = document.createElement("legend");
			legend.className = "judul";
			const prev = document.createElement("img");
			prev.className = "image";
			const input = document.createElement("input");
			input.type = "file";
			input.accept = "image/*";
			input.capture = "environment";
			input.onchange = () => {
				const selected = input.files[0];
				if (selected) {
					const img = URL.createObjectURL(selected);
					prev.src = img;
					prev.style.display = "block";
				}
			}
			const produk = await getData("produk");
			const realName = produk.find(p => String(p.id_produk) === String(id))?.nama ?? "";
			if (realName) {
				legend.textContent = realName;
				const btn = makeButton("btn", "Simpan", () => this.simpanGambarKatalog(realName, input));
				for (const item of [legend, prev, input, btn]) {
					field.appendChild(item);
				}
			}
		}
		editProduk(id) {
			this.itemEdit = this.produk.find(item => String(item.id_produk) === String(id)) ?? null;
			if (this.itemEdit) {
				const wadah = pembuatJendela();
				const pr = makeParent("editor");
				wadah.appendChild(makeLabel("📝 Edit produk", "teks"));
				wadah.appendChild(pr);
				const pr1 = makeParent("container");
				const pr2 = makeParent("container");
				const pr3 = makeParent("container");
				const pr4 = makeParent("container");
				
				this.ent = {}
				Object.entries(this.itemEdit).forEach((it, i) => {
					const [key, val] = it;
					let tipe = "text";
					if (![
						"id",
						"id_produk",
						"barcode",
						"jumlah_tertinggi"
					].includes(key.toLowerCase())) {
						if ([
							"harga_beli",
							"harga_jual",
							"harga_modal",
							"isi_satuan",
							"jumlah",
							"poin",
							"stok_minimum"
						].includes(key.toLowerCase())) {
							tipe = "number";
						}
						const entry = makeEntry("Masukkan " + key.replace(/_/g, " ") + " baru", tipe);
						entry.value = val;
						let parent = null;
						if (i < 6) {
							parent = pr1;
						} else if ( i >= 6 && i < 12) {
							parent = pr2;
						} else {
							parent = pr3;
						}
						parent.appendChild(makeLabel(key.replace(/_/g, " ").toUpperCase(), "teks"));
						parent.appendChild(entry);
						this.ent[key] = entry;
					}
				})
				
				for (const ip of [pr1, pr2, pr3, pr4]) {
					pr.appendChild(ip);
				}
				
				const kategori =  [...new Set(this.produk.map(p => p.kategori))];
				const satuanJual = [...new Set(this.produk.map(p => p.satuan_jual))];
				const satuanBeli = [...new Set(this.produk.map(p => p.satuan_beli))];
				const supplier = [...new Set(this.produk.map(p => p.supplier))];
				
				this.combKategori = pembuatCombo(pr4, "Pilih kategori", kategori);
				this.combSatuanJual = pembuatCombo(pr4, "Pilih satuan jual", satuanJual);
				this.combSatuanBeli = pembuatCombo(pr4, "Pilih satuan beli", satuanBeli);
				this.combSupplier = pembuatCombo(pr4, "Pilih supplier", supplier);
				
				const btns = [
					["btn", "Simpan", () => this.simpanEdit()],
					["btn btn-cancel", "Batal", () => {hideWindow();}]
				]
				pembuatButton(wadah, btns);
			}
		}	
		
		async simpanEdit() {
			const result = Object.fromEntries(
				Object.entries(this.ent).map(([key, val]) => [key, val.value.trim()])
			);
			
			try {
				const ktgr = this.combKategori.value;
				const sj = this.combSatuanJual.value;
				const sb = this.combSatuanBeli.value;
				const sup = this.combSupplier.value;
			
				const kategori = ktgr !== "Pilih kategori" ? ktgr : (result.kategori ?? "");
				const satuanBeli = sb !== "Pilih satuan beli" ? sb : (result.satuan_beli ?? "");
				const satuanJual = sj !== "Pilih satuan jual" ? sj : (result.satuan_jual ?? "");
				const supplier = sup !== "Pilih supplier" ? sup : (result.supplier ?? "");
				
				const jumlah = Number(result.jumlah) || 0;
				const hargaBeli = parseFloat(result.harga_beli) || 0;
				const isiSatuan = Number(result.isi_satuan) || 0;
		
				const data = this.itemEdit;
		
				const stokTertinggi =
					(data.jumlah_tertinggi ?? 0) < jumlah
						? jumlah
						: (data.jumlah_tertinggi ?? 0);

				const hargaModal = jumlah > 0 ? (hargaBeli / jumlah) : 0;
		
				const choosenProduk = this.produk.filter(
					p => (p.id_produk || "") !== (data.id_produk || "")
				);
		
				for (const p of choosenProduk) {
					if ((p.nama || "").toLowerCase() === (result.nama || "").toLowerCase()) {
						await modalShow(gagal, "Terdeteksi duplikasi nama produk");
						return;
					}
				}
		
				if (await modalShow(confirm, "Simpan data sekarang?")) {
					const dataEdit = {
						nama_lama: data.nama ?? "",
						barcode_lama: data.barcode ?? "",
						id: data.id ?? 0,
						barcode: result.barcode ?? data.barcode,
						nama: result.nama ?? data.nama,
						catatan: result.catatan ?? data.catatan,
						kategori: kategori,
						kadaluarsa: result.kadaluarsa ?? data.kadaluarsa,
						satuan_beli: satuanBeli,
						satuan_jual: satuanJual,
						isi_satuan: isiSatuan,
						harga_beli: hargaBeli,
						harga_jual: parseFloat(result.harga_jual) || 0,
						jumlah: jumlah,
						stok_minimum: parseInt(result.stok_minimum) || 0,
						supplier: supplier,
						jumlah_tertinggi: stokTertinggi,
						poin: parseInt(result.poin) || 0
					};
		
					const datriw = {
						aksi: "Edit produk",
						nama_lama: data.nama || "",
						nama: result.nama,
						jumlah_lama: data.jumlah || 0,
						jumlah: jumlah,
						modal_lama: data.harga_modal || 0,
						harga_modal: hargaModal,
						jual_lama: data.harga_jual || 0,
						harga_jual: parseFloat(result.harga_jual) || 0,
						catatan_lama: data.catatan || "",
						catatan: result.catatan || "",
						barcode: data.barcode || "",
						operator: user,
						sumber: idDevice
					};
		
					const upload = await postDataKedua("edit_produk", {
						data: dataEdit,
						riwayat: datriw
					});
		
					if (upload) {
						await modalShow(upload.stat, upload.pesan);
					} else {
						await modalShow(gagal, pesanGagal);
					}
				}
			} catch (er) {
				console.error(er);
				await modalShow(gagal, String(er));
			}
		}

		async tambahStok(id) {
			const item = this.produk.find(p => String(p.id_produk) === String(id)) ?? null;
			if (item) {
				const tambah = await modalShow("Tambahan", "Masukkan tambahan stok untuk " + item.nama, true);
				if (tambah) {
					const tambahan = parseInt(tambah);
					const stok = item.jumlah + tambahan;
					let tertinggi = item.jumlah_tertinggi;
					if (stok > tertinggi) {
						tertinggi = stok;
					}
					const datriw = {
						aksi: "Tambah stok",
						nama: item.nama,
						jumlah: tambahan,
						barcode: item.barcode,
						stok_terbaru: stok,
						operator: user,
						sumber: idDevice
					}
					const data = {
						tambahan: tambahan,
						jumlah_tertinggi: tertinggi,
						id_produk: item.id_produk
					}
					const upload = await postDataKedua("tambah_stok", {data_tambah: data, riwayat: datriw});
					if (upload) {
						await modalShow(upload.stat, upload.pesan);
					} else {
						await modalShow(gagal, pesanGagal);
					}
					this.setup();
				}
			}
		}

			const item = this.produk.find(p => String(p.id_produk) === String(id)) ?? null;
			if (item) {
				const parent = pembuatJendela();
				const pr = makeParent("container");
				pr.style.display = "grid";
				pr.style.gridTemplateColumns = "repeat(3, 1fr)";
				
				for (const [key, value] of Object.entries(item)) {
					const labelKey = makeLabel(key.replace(/_/g, " "), "biasa");

				}

		setKiri() {
			const div = pembuatField(this.kiri, "STATISTIK PRODUK");
			const jual = this.produk.reduce((sum, b) => sum + b.harga_jual * b.jumlah, 0);
			const modal = this.produk.reduce((sum, b) => sum + b.harga_modal * b.jumlah, 0);
			const untung = jual - modal;
			for (const x of [
				makeLabel("Jumlah produk terdaftar: " + this.produk.length + " unit", "label-data"),
				makeLabel("Total jumlah stok: " + this.produk.reduce((sum, b) => sum + b.jumlah, 0) + " pcs", "label-data"),
				makeLabel("Total harga pokok penjualan: " + formatMataUang(Math.round(modal)), "label-data"),
				makeLabel("Total estimasi penjualan: " + formatMataUang(Math.round(jual)), "label-data"),
				makeLabel("Total estimasi keuntungan: " + formatMataUang(Math.round(untung)), "label-data")
			]) {
				div.appendChild(x);
			}
			const divMenu = pembuatField(this.kiri, "Menu utama produk");
			const btns = [
				["invisible-btn", "Tambah produk baru", () => this.tambahProdukBaru()],
				["invisible-btn", "Daftar produk", () => this.daftarProduk()],
				["invisible-btn", "Daftar produk diskon", () => this.daftarProdukDiskon()],
				["invisible-btn", "Daftar produk tingkat", () => this.daftarProdukTingkat()],
				["invisible-btn", "Laporan stok", () => this.laporanStok()],
				["invisible-btn", "Kelola gambar produk", () => this.kelolaGambarProduk()]
			]
			pembuatButton(divMenu, btns);
		}
		async hapusSemuaGambar(paths) {
			if (paths.length === 0) {
				await modalShow(gagal, "Gambar produk tidak tersedia");
				return;
			}
			if (await modalShow(confirm, "Anda yakin ingin menghapus seluruh gambar produk?")) {
				let deleted = 0;
				for (const path of paths) {
					await postDataKedua("hapus_foto", {path: path});
					deleted += 1;

		async simpanTingkat() {
			const path = this.path.value;
			if (path.toLowerCase() === "pilih tingkat") {
				await modalShow(gagal, "Silahkan pilih tingkat terlebih dahulu");
				return;
			}
			const hargaJual = this.entTingkat.harga.value.trim();
			const minimum = this.entTingkat.min.value.trim();
			if (![hargaJual, minimum].every(Boolean)) {
				await modalShow(gagal, "Silahkan masukkan harga jual dan minimum pembelian terlebih dahulu");
				return;
			}
			const id = this.tengah.querySelector("input:checked")?.value;
			const produk = this.produk.find(p => (p.id_produk || "") === (id || "")) ?? null;
			if (!produk) {
				await modalShow(gagal, "Produk tidak ditemukan");
				return;
			}
		
			const pathQuery = path.replace(/ /g, "_").toLowerCase();
			const hj = parseFloat(hargaJual);
			const min = parseInt(minimum);
			const data = {
				id_produk: produk.id_produk,
				barcode: produk.barcode,
				nama: produk.nama,
				harga_modal: produk.harga_modal * min,
				harga_jual: hj,
				min_beli: min,
				path: pathQuery
			}
			if (await modalShow(confirm, "Data telah siap. Simpan sekarang?")) {
				const upload = await postDataKedua("tambah_tingkat_produk", data);
				if (upload) {
					await modalShow(upload.stat, upload.pesan);
				} else {
					await modalShow(gagal, pesanGagal);
				}
			}
		}

		kalkulasiTingkat(p = 0) {
			const min = parseInt(p);
			const id = this.tengah.querySelector("input:checked")?.value;
			const produk = this.produk.find(p => p.id_produk === id) ?? null;
			if (produk) {
				const hm = (produk.harga_modal || 0) * min
				const hj = (produk.harga_jual || 0) * min
			 	const kn = hj - hm
				const rkm = 50/100 * kn
				const rhjm = hm + rkm
				this.labelInfoTingkat.textContent = `
					Harga modal normal: ${formatMataUang(hm)}
					Harga jual normal: ${formatMataUang(hj)}
					Keuntungan normal: ${formatMataUang(kn)}
					Rekomendasi keuntungan minimal: ${formatMataUang(rkm)}
					Rekomendasi harga jual minimal: ${formatMataUang(rhjm)}
		
					Rekomendasi harga jual minimal diperoleh dari:
					50% keuntungan normal dan harga jual normal
				`
			}
		}
		
		kalkulasiDiskon(p=0) {
			const data = this.ident.value.split(" ");
			const id = data.at(0);
			const item = this.produk.find(p => (p.id_produk || "") === (id || ""));
			const hm = item.harga_modal;
			const hj = item.harga_jual;
			const hjb = hj * (1 - p / 100);
			const ekn = hj - hm;
			const ekb = hjb - hm;
			const teks = `
				Harga modal produk: ${formatMataUang(hm)}
				Harga jual normal: ${formatMataUang(hj)}
				Harga jual baru: ${formatMataUang(hjb)}
				Estimasi keuntungan normal: ${formatMataUang(ekn)}
				Estimasi keuntungan baru: ${formatMataUang(ekb)}
				Keuntungan dikurangi: ${formatMataUang(ekn - ekb)}

				Kalkulasi ini ditujukan untuk 1 unit produk dalam satuan jual terkecil
				(pcs, unit, bungkus, kaleng, dan lain-lain).
			`
			this.labelInfoDiskon.textContent = teks;
		}

	class Transaksi {
		constructor() {
			this.produk = null;
			this.pajak = null;
			this.qr = null;
			this.inputAktif = null;
			this.bayar = 0;
			this.kembali = 0;
			this.noTrans = "";
			this.sudahBayar = 0;
			this.namaPembeli = "";
			this.nomorTelepon = "";
			document.addEventListener("click", (e) => {
		    if (this.inputAktif && !e.target.closest("button, input, select, textarea")) {
		      this.refocusInput();
		    }
			});
		}
		generateNoTrans() {
			const tipe1 = String(inisialCode).slice(0,1).toUpperCase();
			const tipe2 = Math.floor(Math.random() * 100) + 10;
			const tipe3 = Math.floor(Math.random() * 900000) + 100000;
			this.noTrans = String(tipe1) + String(tipe2) + "_" + String(tipe3);
		}
		refocusInput() {
		  if (this.inputAktif) {
		     this.inputAktif.focus();
		  }
		}
		operasiQty(id, tipe) {
			const item = keranjang.find(p => String(p.id) === String(id)) ?? null;
			if (!item) {
				return;
			}
			if (tipe === "-") {
				if (item.qty > 0) {
					item.qty -= 1;
				}
			} else {
				const jumlah = this.produk.find(p => String(p.id_produk) === String(id))?.jumlah ?? 0;
				if (item.qty < jumlah) {
					item.qty += 1;
				}
			}
			this.tambahkanSecondKeranjang();
		}
		async aktifkanPajak() {
			await postDataKedua("pajak_selalu_aktif", {aktif: this.termasukPajak.checked});
		}
		async sertakanQr() {
			await postDataKedua("cetak_qr_di_struk", {status: this.cetakQr.checked});
		}
		prepareAtas() {
			this.termasukPajak = makeCekTrx(this.atas, "Termasuk pajak");
			this.cetakQr = makeCekTrx(this.atas, "Cetak qr/barcode");
			this.termasukPajak.checked = this.aktif;
			this.termasukPajak.onchange = () => this.aktifkanPajak();
			this.cetakQr.checked = this.qrAktif;
			this.cetakQr.onchange = () => this.sertakanQr();
			
			pembuatButton(this.atas, [
				["btns2", "↩️ Undo", () => this.doUndo()],
				["btns2", "↪️ Redo", () => this.doRedo()],
				["btns2", "🔄 Refresh", () => this.doRefresh()],
				["btns2", "➡️ Kembali", () => {window.location.href = url + "dashboard_admin"}]
			])
		}
		doRefresh() {
			secondKeranjang.length = 0;
			keranjang.length = 0;
			totalBelanja = 0
			this.labelTotal.textContent = formatMataUang(totalBelanja);
			this.setup();
		}
		prepareAtasTengah() {
			const kiri = makeParent("container");
			kiri.style.width = "fit-content";
			const kanan = document.createElement("div");
			kanan.style.background = "var(--header-bg)";
			kanan.style.flex = "1";
			kanan.style.width = "100%"
			kiri.appendChild(makeLabel("👤 " + user.toUpperCase(), "label-data"));
			kiri.appendChild(makeLabel("🪪 " + inisialCode, "label-data"));
			this.labelTotal = makeLabel(formatMataUang(totalBelanja), "total");
			kanan.appendChild(this.labelTotal);
			
			for (const item of [kiri, kanan]) {
				this.atasTengah.appendChild(item);
			}
		}
		setEmptyRow() {
			const tr = document.createElement("tr");
			tr.innerHTML = `
				<td>
					<input style="width: 100%; padding: 10px; border: none; background: transparent;" id="input-barcode">
				</td>
				<td></td>
				<td></td>
				<td></td>
				<td></td>
			`
			this.tabel.appendChild(tr);
			this.inputAktif = tr.querySelector("#input-barcode");
			this.refocusInput();
			
			this.inputAktif.oninput = () => this.searchProduk(this.inputAktif.value.trim());
			this.inputAktif.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					const val = this.inputAktif.value.trim();
					if (val === "") {
						this.checkoutBayar();
					} else {
						this.tambahKeranjang(val, 1);
					}
				}
			})
		}
		hitungKembalian(bayar) {
			if (["0", ""].includes(bayar)) {
				this.kembalian.textContent = "Kembali: " + formatMataUang(0);
				this.kembalian.style.color = "red";
				return
			}
			this.bayar = parseFloat(bayar);
			const totalAsli = totalBelanja - this.sudahBayar;
			this.kembali = this.bayar - totalAsli;
			let warna = "green";
			if (this.kembali < 0) {
				warna = "red";
			}
			this.kembalian.textContent = "Kembali: " + formatMataUang(this.kembali);
			this.kembalian.style.color = warna;
		}
		async resetTransaksi() {
			secondKeranjang.length = 0;
			keranjang.length = 0;
			this.bayar = 0;
			this.nomorTelepon = "";
			this.namaPembeli = "";
			this.sudahBayar = 0;
			this.kembali = 0;
			const dt = { no: this.noTrans, status: "Sudah dilunasi" };
			await postDataKedua("ganti_status_cadangan", dt);
			this.generateNoTrans();
			hideWindow();
			this.lihatKeranjang();
		}
		async transaksiSelesai() {
			const jumlahBayar = this.sudahBayar + this.bayar;
			if (secondKeranjang.length === 0) {
				await modalShow(gagal, "Keranjang kosong");
				return;
			}
			if (jumlahBayar < totalBelanja) {
				await modalShow(gagal, "Pembayaran tidak cukup");
				return;
			}
			const namaPembeli = this.infoBuyer.nama.value.trim();
			const kontakPembeli = this.infoBuyer.kontak.value.trim();
			const pembeli = `${namaPembeli} ${kontakPembeli}`;
			const data = {
				items: secondKeranjang,
				total: parseFloat(totalBelanja),
				bayar: parseFloat(jumlahBayar),
				kembali: parseFloat(this.kembali),
				sumber: String(idDevice),
				operator: String(user),
				no_trans: this.noTrans,
				pembeli: pembeli
			}
			const upload = await postData("penjualan_campuran", data);
			showInfo(upload);
			this.resetTransaksi();
		}
		async checkoutBayar() {
			if (keranjang.length === 0) {

		async tambahKeranjang(id, qty) {
			if ([NaN, "", "0"].includes(qty)) {
				return;
			}
			qty = parseInt(qty);
			const item = this.produk.find(p => String(p.id_produk) === String(id) || String(p.barcode) === String(id) || String(p.nama.toLowerCase()) === String(id.toLowerCase())) ?? null;
			if (item) {
				const foundKeranjang = keranjang.find(p => String(p.id) === String(item.id_produk)) ?? null;
				if (foundKeranjang) {
					const totalQty = foundKeranjang.qty + qty
					if (totalQty > item.jumlah) {
						await modalShow(gagal, "Stok produk tidak cukup");
						return
					}
					foundKeranjang["qty"] = totalQty;
				} else {
					if (qty > item.jumlah) {
						await modalShow(gagal, "Stok produk tidak cukup");
						return
					}
					keranjang.push({
						nama: item.nama,
						barcode: item.barcode,
						id: item.id_produk,
						qty: qty,
						harga: item.harga_jual
					})
				}
			} else {
				await modalShow(gagal, "Produk tidak ditemukan");
				return;

			this.tambahkanSecondKeranjang();

		async muatUlangCadangan(data, no) {
			const item = data.find(p => String(p.no) === String(no)) ?? null;
			if (item["status"].toLowerCase() === "sudah dilunasi") {
				await modalShow(gagal, "Transaksi nomor " + item.no + " telah dibayar lunas");
				return;
			}
			hideWindow();
			keranjang = JSON.parse(item.keranjang);
			const infoPembeli = item.nama_pembeli.split(" ");
			if (infoPembeli.length >= 2) {
				const nope = infoPembeli.at(-1);
				if (/^\d+$/.test(nope)) {
					this.nomorTelepon = nope;
					this.namaPembeli = infoPembeli.slice(0, -1).join(" ");
				} else {
					this.namaPembeli = item.nama_pembeli;
				}
			} else {
				this.namaPembeli = item.nama_pembeli;
			}
			this.noTrans = item.no;
			this.sudahBayar = item.jumlah_dibayar;
			this.tambahkanSecondKeranjang();
		}

	class TransaksiCepat {
		constructor() {
			this.produk = null;
			this.pajak = null;
			this.keranjang = [];
			this.secondKeranjang = [];
			this.currentSearchId = 0;
			this.totalBelanja = 0;
			this.kembalian = 0;
			this.persenPajak = 0;
			this.aktifPajak = 0;
			this.noTrans = "";
		}
		generateNoTrans() {
			this.noTrans = createNo();
		}
		updateKeranjang() {
			this.badge.textContent = this.secondKeranjang.length;
		}
		async tambahkanSecondKeranjang() {
			try {
				const hasilValidasi = await fetch(url + "tambahkan_second_keranjang", {
					method: "POST",
					headers: {
	          "Content-Type": "application/json",
	        },
	        body: JSON.stringify(this.keranjang)
				});
				const result = await hasilValidasi.json()
				this.totalBelanja = result.total
				this.labelTotal.textContent = "Total: " + formatMataUang(result.total);
				this.secondKeranjang = result.data || [];
				this.updateKeranjang();
			} catch (er) {
				await modalShow(error, er);
			}
		}
		async tambahKeranjang(id, qtyInput) {
			const qtyValue = qtyInput.value.trim();
			if ([NaN, "0", ""].includes(qtyValue)) {
				return;
			}
			const qty = parseInt(qtyValue);
			const find = this.keranjang.find(p => p.id === id) ?? null;
			const prd = this.produk.find(p => p.id_produk === id) ?? null;
			if (find) {
				const totalQty = find.qty + qty;
				if (totalQty > prd.jumlah) {
					await modalShow(gagal, "Stok tidak cukup");
					return;
				}
				find.qty = totalQty;
			} else {
				if (qty > prd.jumlah) {
					await modalShow(gagal, "Stok tidak cukup");
					return;
				}
				this.keranjang.push({
					nama: prd.nama,
					barcode: prd.barcode,
					qty: qty,
					harga: prd.harga_jual,
					id: prd.id_produk
				})
			}
			qtyInput.value = "";
			this.tambahkanSecondKeranjang();
		}
		async cariProduk(produk="") {
			this.frBawah.innerHTML = "";
			const searchId = ++this.currentSearchId;
			try {
				for (const item of this.produk) {
					if (searchId !== this.currentSearchId) return;
					if (
						item.nama.toLowerCase().includes(produk.toLowerCase()) ||
						item.kategori.toLowerCase().includes(produk.toLowerCase()) ||
						item.barcode.includes(produk) ||
						item.id_produk.includes(produk)
					) {
						const fr = pembuatField(this.frBawah, item.nama);
						fr.appendChild(makeLabel("🏷️ " + item.barcode), "biasa");
						fr.appendChild(makeLabel("🆔 " + item.id_produk), "biasa");
						fr.appendChild(makeLabel("Jumlah stok: " + formatUnit(item.jumlah, item.satuan_jual), "biasa"));
						fr.appendChild(makeLabel("Harga jual: " + formatMataUang(addPajak(item.harga_jual, this.aktifPajak, this.persenPajak)), "biasa"));
						const qty = makeEntry("Masukkan jumlah", "number");
						fr.appendChild(qty);
						fr.appendChild(makeButton("btn", "Tambah", () => this.tambahKeranjang(item.id_produk, qty)));
					}
				}
			} catch (er) {}
		}
		async hapusProduk(id) {
			this.keranjang = this.keranjang.filter(p => p.id !== id);
			await this.tambahkanSecondKeranjang();
			this.lihatKeranjang();
		}
		async selesaikanTransaksi(input) {
			const result = Object.fromEntries(Object.entries(input).map(([key, val]) => [key, val.value.trim()]));
			let bayar = 0;
			if (result["jumlah bayar"] !== "") {
				bayar = parseFloat(result["jumlah bayar"]);
			}
			if (bayar < this.totalBelanja) {
				await modalShow(gagal, "Pembayaran tidak cukup");
				return;
			}
			const namaPembeli = result.nama;
			const kontak = result["nomor telepon"];
			const pembeli = namaPembeli + " " + kontak;
			const data = {
				items: this.secondKeranjang,
				total: parseFloat(this.totalBelanja),
				bayar: parseFloat(bayar),
				kembali: parseFloat(this.kembalian),
				sumber: String(idDevice),
				operator: String(user),
				no_trans: this.noTrans,
				pembeli: pembeli
			}
			if (await modalShow(confirm, "Data telah siap. Selesaikan transaksi sekarang?")) {
				const up = await postData("penjualan_campuran", data);
				if (up) {
					await modalShow(up.stat, up.pesan);
					this.resetTrx();
				} else {
					await modalShow(gagal, pesanGagal);
				}
			}
		}
		resetTrx() {
			this.secondKeranjang.length = 0;
			this.keranjang.length = 0;
			this.totalBelanja = 0;
			this.labelTotal.textContent = "Total: " + formatMataUang(this.totalBelanja);
			this.setup();
		}
		lihatKeranjang() {
			this.frBawah.innerHTML = "";
			const fr = makeParent("profil-container");
			this.frBawah.appendChild(fr);
			for (const item of this.secondKeranjang) {
				const frame = pembuatField(fr, item.nama);
				const bd = document.createElement("label");
				bd.className = "badge";
				bd.textContent = "x";
				bd.onclick = () => this.hapusProduk(item.id);
				frame.appendChild(bd);
				frame.appendChild(makeLabel("Qty: " + formatUnit(item.qty, "unit"), "biasa"));
				frame.appendChild(makeLabel("Harga jual: " + formatMataUang(item.harga_jual), "biasa"));
				frame.appendChild(makeLabel("Subtotal: " + formatMataUang(item.subtotal_jual), "biasa"));
			}
			const co = pembuatField(this.frBawah, "Checkout");
			const ent = pembuatEntry(co, [
				["jumlah bayar", "Jumlah bayar", "number"],
				["nama", "Nama pembeli", "text"],
				["nomor telepon", "Nomor telepon", "number"]
			])
			ent["jumlah bayar"].oninput = () => this.hitungKembalian(ent["jumlah bayar"].value.trim())
			co.appendChild(makeButton("btn", "Selesai", () => this.selesaikanTransaksi(ent)));
		}
		hitungKembalian(bayar) {
			let jumlahBayar = 0;
			if (bayar !== "") {
				jumlahBayar = parseFloat(bayar);
			}
			this.kembalian = jumlahBayar - this.totalBelanja;
			this.labelTotal.textContent = "Kembali: " + formatMataUang(this.kembalian);
		}
		prepareFrames() {
			this.labelTotal = document.getElementById("jdl");
			this.labelTotal.textContent = "Total: " + formatMataUang(this.totalBelanja);
			
			const atas = makeParent("container-horizontal");
			this.cari = makeEntry("Cari produk", "text");
			this.cari.oninput = () => this.cariProduk(this.cari.value.trim());
			const btnKeranjang = makeButton("btn btn-cancel", "🛒", () => this.lihatKeranjang());
			this.badge = document.createElement("label");
			this.badge.className = "badge";
			this.badge.textContent = this.keranjang.length;
			btnKeranjang.appendChild(this.badge);
			for (const item of [this.cari, btnKeranjang]) {
				atas.appendChild(item);
			}
			this.tengah.appendChild(atas);
			this.frBawah = makeParent("frame");
			this.tengah.appendChild(this.frBawah);
		}
		async setup() {
			resetPop();
			this.produk = await getData("produk");
			this.pajak = await getData("pajak");
			this.tengah = document.querySelector(".tengah");
			this.tengah.innerHTML = "";
			if (this.pajak) {
				this.persenPajak = this.pajak[0].persen;
				this.aktifPajak = this.pajak[0].aktif;
			}
			this.generateNoTrans();
			this.prepareFrames();
		}
	}
	
	class OpsiTransaksi {
		async ringkasanTransaksi(periode) {
			resetJudul("Ringkasan transaksi");
			this.prt.innerHTML = "";
			const parent = makeParent("frame");
			this.prt.appendChild(parent);
			
			const data = await getDt(`get_data_sold_out_today/${periode}`);
			if (data) {
				const pr1 = pembuatField(parent, `Informasi penjualan ${periode.replace(/_/g, " ")}`);
				pr1.style.display = "grid";
				pr1.style.gridTemplateColumns = "repeat(3,1fr)";
				for (const [key, value] of Object.entries(data)) {
					if (key.toLowerCase() !== "data") {
						const lbla = makeLabel(key.toUpperCase(), "biasa");
						const titik = makeLabel(":", "biasa");
						let val = formatMataUang(value);
						if (key.toLowerCase() === "terjual") {
							val = formatUnit(value, "unit");
						}
						const lblb = makeLabel(val, "biasa");
						for (const item of [lbla, titik, lblb]) {
							pr1.appendChild(item);
						}
					}
				}
				grafikMaker(
					parent,
					`PENJUALAN ${periode.replace(/_/g, " ").toUpperCase()}`,
					"Pemasukan dan keuntungan",
					["Pemasukan", "Keuntungan"],
					"Laporan penjualan",
					[data.total, data.laba]
				)
				const tabel = makeTable(`
					<tr>
						<th>Id produk</th>
						<th>Nama produk</th>
						<th>Terjual</th>
						<th>Pemasukan</th>
						<th>Keuntungan</th>
					</tr>
				`)
				for (const item of data.data) {
					const tr = document.createElement("tr");
					tr.innerHTML = `
						<td>${item.id_produk}</td>
						<td>${item.nama}</td>
						<td>${item.terjual}</td>
						<td>${formatMataUang(item.total)}</td>
						<td>${formatMataUang(item.laba)}</td>
					`
					tabel.appendChild(tr);
				}
				this.prt.appendChild(tabel)
			}
		}
		setButtonBawah() {
			pembuatButton(this.bawah, [
				["btn", "Ringkasan transaksi", () => this.setup()],
				["btn", "Transaksi mobile", async () => {await trx.setup()}],
				["btn", "Transaksi desktop", async () => {await transaksi.setup()}]
			])
		}
		setTengah() {
			this.tengah.innerHTML = "";
			const btnFr = makeParent("container-horizontal");
			pembuatButton(btnFr, [
				["btns", "Hari ini", () => this.ringkasanTransaksi("hari_ini")],
				["btns", "Minggu ini", () => this.ringkasanTransaksi("minggu_ini")],
				["btns", "Bulan ini", () => this.ringkasanTransaksi("bulan_ini")]
			])
			
			this.prt = makeParent("container");
			for (const fr of [btnFr, this.prt]) {
				this.tengah.appendChild(fr);
			}
		}
		setup() {
			resetPop();
			this.tengah = document.querySelector("#tgh");
			this.bawah = document.querySelector("#bwh");
			for (const item of [this.tengah, this.bawah]) {
				item.innerHTML = "";
			}
			this.setButtonBawah();
			this.setTengah();
			this.ringkasanTransaksi("hari_ini");
		}
	}
	class Riwayat {
		constructor() {
			this.dataFilter = null;
			this.pengguna = null;
		}
		async getDataFilter(periode, operator) {
			const aspek = {
				periode: periode,
				operator: operator
			}
			const data = await getDt("get_riwayat_filter/" + JSON.stringify(aspek));
			this.dataFilter = data;
		}
		prepareBawah() {
			pembuatButton(this.bawah, [
				["btn", "Riwayat penjualan", () => this.riwayatPenjualan()],
				["btn", "Riwayat aktivitas", () => this.riwayatAktivitas()]
			])
		}
		async riwayatAktivitas() {
			const riwayat = await getData("riwayat");
			this.tengah.innerHTML = "";
			const parent = pembuatField(this.tengah, "Riwayat aktivitas operator");
		}
		lihatDetailRiwayat(data) {
			if (data) {
				const wadah = pembuatJendela();
				
				for (const f of data) {
					const wdh = pembuatField(wadah, f.nama);
					wdh.style.display = "grid";
					wdh.style.gridTemplateColumns = "repeat(3,1fr)";
				
					for (const [key, value] of Object.entries(f)) {
						if (key.toLowerCase() !== "nama") {
							let val = String(value);
							if (["harga_asli", "harga_jual", "harga_modal", "laba", "potongan_diskon", "potongan_tingkat", "subtotal_jual", "subtotal_modal"].includes(key.toLowerCase())) {
								val = formatMataUang(Math.round(value));
							} else if (["qty", "qty_asli"].includes(key.toLowerCase())) {
								val = formatUnit(value, "unit");
							}
							const lkey = makeLabel(key.replace(/_/g, " "), "biasa");
							const titik = makeLabel(":", "biasa");
							const lval = makeLabel(val, "biasa");
							for (const p of [lkey, titik, lval]) {
								wdh.appendChild(p);
							}
							wadah.appendChild(wdh);
						}
					}
				}
			}
		}
		async lihatDataRiwayat() {
			const periode = this.periode.value;
			const operator = this.operator.value;
			await this.getDataFilter(periode, operator);
			this.bwh.innerHTML = "";
			this.dataFilter.forEach((items, i) => {
				const parent = pembuatField(this.bwh, items.waktu);
				parent.style.display = "grid";
				parent.style.gridTemplateColumns = "repeat(3,1fr)";
				for (const [key, value] of Object.entries(items)) {
					if (!["id", "data_belanja", "waktu"].includes(key.toLowerCase())) {
						let statusPajak = "Tidak termasuk pajak";
						if (key.toLowerCase() === "status_pajak") {
							if (value === 1) {
								statusPajak = "Termasuk pajak";
							}
						}
						let val = String(value);
						if (["bayar", "kembali", "kena_pajak", "total", "total_laba"].includes(key.toLowerCase())) {
							val = formatMataUang(Math.round(value));
						} else if (key.toLowerCase() === "status_pajak") {
							val = statusPajak;
						}
						const labelKey = makeLabel(key.replace(/_/g, " "), "biasa");
						const titik = makeLabel(":", "biasa");
						const labelValue = makeLabel(val, "biasa");
						for (const item of [labelKey, titik, labelValue]) {
							parent.appendChild(item);
						}
					}
				}
				pembuatButton(parent, [
					["btns2", "🔍 Detail", () => this.lihatDetailRiwayat(JSON.parse(items.data_belanja))],
					["btns2", "🗑 Hapus", () => this.hapusRiwayat(JSON.parse(items.data_belanja))]
				])
			});
		}
		riwayatPenjualan() {
			this.tengah.innerHTML = "";
			resetJudul("Riwayat penjualan");
			this.atas = makeParent("container-horizontal");
			this.bwh = makeParent("frame");
			for (const item of [this.atas, this.bwh]) {
				this.tengah.appendChild(item)
			}
			this.periode = pembuatCombo(this.atas, "Semua periode", ["Hari ini", "Minggu ini", "Bulan ini"]);
			this.operator = pembuatCombo(this.atas, "Semua operator", [...new Set(this.pengguna.map(p => p.nama))]);
			pembuatButton(this.atas, [
				["btn", "Lihat data", () => this.lihatDataRiwayat()],
				["btn", "Hapus semua", () => this.hapusRiwayat()]
			])
		}
		async setup() {
			resetPop();
			resetJudul("Riwayat")
			this.pengguna = await getData("user");
			this.tengah = document.querySelector(".tengah");
			this.bawah = document.querySelector(".bawah");
			for (const item of [this.tengah, this.bawah]) {
				item.innerHTML = "";
			}
			this.prepareBawah();
			this.riwayatPenjualan();
			this.lihatDataRiwayat();
		}
	}

  const pemilik = new Pemilik();
  const pengguna = new Pengguna();
  const userMenu = new UserMenu();
  const transaksi = new Transaksi();
  const produk = new Produk();
  const pajak = new Pajak();
  const cs = new SupplierCustomer();
  const biaya = new Pengeluaran();
  const trx = new TransaksiCepat();
  const riwayat = new Riwayat();
  const opsiTransaksi = new OpsiTransaksi();
  window.onload = function() {
    validasiLogin();
  };
  
</script>
